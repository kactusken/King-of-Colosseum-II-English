<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrestler Database</title>
<!--HEAD-->
<style>
/*COMMON_CSS*/
/* Layout: header + tabs; the database is a filterable list beside a profile panel. Built by tools/rosterdb.py. */
.view { overflow: auto; padding: 2px 4px 0 2px; }
.view:focus { outline: none; }
#db { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 12px; overflow: hidden; }
.listcol { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
/* filters: the list switch and search on one row, the selects sharing the next */
.filters input[type="search"] { font: 14px var(--body); padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); flex: 1; min-width: 120px; }
.filters.sel select { flex: 1 1 0; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 600 13px var(--body); border: 0; background: var(--surface); color: var(--muted); padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.count { font-size: 12.5px; color: var(--muted); }
/* the list: dense rows, each with its promotion's colour on the left edge; keyboard: arrows */
ul.list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 300px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
ul.list:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
ul.list li { padding: 5px 12px 5px 13px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; box-shadow: inset 3px 0 0 var(--pc, transparent); }
ul.list li:hover { background: var(--sunk); }
ul.list li.sel { background: var(--accent-soft); box-shadow: inset 5px 0 0 var(--accent); }
ul.list .nm { font-weight: 700; font-size: 14.5px; }
ul.list .sub2 { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.cc { font: 700 11px var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
.lock { font: 700 11.5px/1 var(--body); border-radius: 4px; padding: 3px 6px 2px; white-space: nowrap; align-self: center; }
.lock.shop { background: var(--hl-bg); color: var(--hl); border: 1px solid var(--hl); }
.lock.never { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); border: 1px solid var(--bad); }
.pc-njpw { --pc: var(--p-njpw); } .pc-noah { --pc: var(--p-noah); } .pc-ajpw { --pc: var(--p-ajpw); } .pc-zero1 { --pc: var(--p-zero1); } .pc-wj { --pc: var(--p-wj); } .pc-pancrase { --pc: var(--p-pancrase); }

/* the panel: header, then a sticky jump bar, then the moveset first */
article.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-y: auto; overflow-x: hidden; min-width: 0; padding: 0 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.panel > * { min-width: 0; flex-shrink: 0; }
.panel > .phead { padding-top: 16px; display: grid; gap: 6px; }
.panel h2 { font: 900 38px/1 var(--display); margin: 0; text-transform: uppercase; font-stretch: 62%; }
/* section titles: the game's orange slanted tab, as on the guide */
.panel h3 { justify-self: start; display: inline-block; font: 900 19px/1 var(--display); font-stretch: 62%; text-transform: uppercase; letter-spacing: .01em; background: var(--tab); color: var(--tab-ink); padding: 5px 20px 3px 15px; clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 100%, 0 100%); margin: 0 0 10px; }
.panel section { scroll-margin-top: 52px; }
.panel p { margin: 0; }
.jump { position: sticky; top: 0; z-index: 2; display: flex; gap: 2px; background: var(--surface); border-bottom: 2px solid var(--tab); margin: 0 -20px; padding: 8px 20px 0; }
.jump button { font: 700 13.5px var(--body); font-stretch: 85%; background: none; border: 0; color: var(--muted); padding: 5px 14px 4px; cursor: pointer; clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 100%, 0 100%); }
.jump button:hover { color: var(--ink); background: var(--sunk); }
.nick { font-size: 15px; color: var(--muted); }
.nick b { color: var(--ink); }
.kick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font: 500 13px var(--body); color: var(--muted); }
.ptag { font: 700 12.5px var(--body); color: var(--surface); background: var(--pc, var(--accent)); border-radius: 4px; padding: 1px 6px; }
.kick .lock { margin-left: 4px; }
/* profile facts as one strip, like the game's own wrestler panel */
.facts { display: flex; flex-wrap: wrap; gap: 6px 26px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 0; }
.fact .fk { font: 700 11.5px var(--body); color: var(--muted); text-transform: none; }
.fact .v { font: 700 15px var(--body); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px 40px; }
.statgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 380px)); gap: 6px 48px; }
.statgrid h4 { margin: 0 0 4px; font: 700 13px var(--body); color: var(--muted); }
.bars { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) 22px; gap: 4px 10px; align-items: center; font-size: 13.5px; }
/* bars with a tick at 5; 9-10 stand out */
.bar { height: 10px; background: var(--sunk) linear-gradient(var(--line), var(--line)) 50% 0 / 1px 100% no-repeat; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--bc, var(--accent)); border-radius: 5px; opacity: .85; }
.bars .n { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; }
.bars .hi { color: var(--accent); }
.bars .hi + .bar i, .bars .bar.hi i { opacity: 1; }
.def .bar i { --bc: var(--p-ajpw); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13.5px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; }
.bad { color: var(--bad); font-weight: 700; }
.good { color: var(--good); font-weight: 700; }
/* finisher and signatures: the move, then where it is and its buttons */
ul.sp { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-width: 780px; }
ul.sp li { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--sunk); border-radius: 6px; padding: 5px 10px; }
ul.sp .k2 { font: 700 12px var(--body); color: var(--muted); }
ul.sp li.fin { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
ul.sp li.fin .k2 { color: var(--accent); }
ul.sp .mv { font-weight: 700; }
ul.sp .sl2 { font-size: 12px; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.u { font: 600 12.5px var(--body); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; background: var(--sunk); }
/* the moveset: every card uses the same three columns, so they line up across cards */
.mgroups { display: grid; grid-template-columns: repeat(auto-fill, minmax(345px, 1fr)); gap: 10px; margin-top: 10px; }
.mgroup { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px 8px; break-inside: avoid; }
.mgroup h4 { margin: 0 0 4px; padding-bottom: 3px; font: 700 13px var(--body); border-bottom: 2px solid color-mix(in srgb, var(--tab) 55%, transparent); }
.mr { display: grid; grid-template-columns: 6.2em 7.6em minmax(0, 1fr); gap: 0 6px; align-items: center; font-size: 13px; padding: 2px 0 2px 4px; }
.mr .sit { color: var(--muted); }
.mr .btn2 { white-space: nowrap; line-height: 0; }
.mr .soul { margin-left: 3px; }
.mr.spc { box-shadow: inset 3px 0 0 var(--accent); }
.mr.spc .mvn { color: var(--accent); font-weight: 700; }
.bnote { font: 600 10.5px var(--body); color: var(--muted); vertical-align: middle; margin-left: 3px; }
h4 .bi { width: 16px; height: 16px; }
.legendb { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; align-items: center; }
.legendb span { display: inline-flex; align-items: center; gap: 3px; }
.soul { font: 700 11px/1 "Noto Sans JP", sans-serif; background: #c8102e; color: #fff; border-radius: 3px; padding: 2px 2px; vertical-align: middle; display: inline-block; }
.tagf { font: 700 10.5px var(--body); background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 1px 4px; margin-left: 4px; white-space: nowrap; }
.jp { font-size: 12.5px; color: var(--muted); }
/* Titles & teams: side by side on wide screens */
.tt { display: grid; gap: 16px; }
@media (min-width: 1600px) { .tt { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } .tt .wrap { max-width: none; } }
.tt tr.first td { border-top: 2px solid var(--pc, var(--line)); }
.tt td.camp { font-weight: 700; color: var(--pc, var(--ink)); }
@media (max-width: 900px) {
  #db { grid-template-columns: minmax(0, 1fr); overflow: visible; }
  ul.list { max-height: 30vh; min-height: 160px; flex: none; }
  .statgrid { grid-template-columns: minmax(0, 1fr); }
}
/* print: the open wrestler only, on one or two pages */
@media print {
  :root:root:root { --bg: #fff; --surface: #fff; --sunk: #f1f3f7; --ink: #000; --muted: #444b58; --line: #c7ccd6; --band: #fff; --band-ink: #000; }
  .listcol, nav.tabs, nav.site, #theme, .jump, .sub { display: none !important; }
  html, body, .app, #db, article.panel { display: block; height: auto; overflow: visible; border: 0; padding: 0; }
  .panel > * { margin-bottom: 10px; }
  .panel h3 { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .mgroups { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .bar, .bar i, .ptag, .soul, .tagf, svg.bi { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}
</style>

<div class="app">
  <header>
    <h1><span class="game">King of Colosseum II</span> <span>Wrestler Database</span></h1>
    <div class="sub">Every wrestler, costume and Edit Mode sample in King of Colosseum II, with stats, skills and full movesets, read from the game's own data.</div>
    <button id="theme" type="button"></button>
    <!--NAV-->
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-db" aria-selected="true" aria-controls="db">Wrestlers</button>
    <button role="tab" id="t-titles" aria-selected="false" aria-controls="titles">Titles &amp; teams</button>
    <button role="tab" id="t-about" aria-selected="false" aria-controls="about">About the data</button>
  </nav>

  <section class="view" id="db" role="tabpanel">
    <div class="listcol">
      <div class="filters">
        <div class="seg" id="kind" role="group" aria-label="List"></div>
        <input type="search" id="q" placeholder="Name, nickname or move" aria-label="Search names, nicknames and moves">
      </div>
      <div class="filters sel">
        <select id="f-promo" aria-label="Promotion"></select>
        <select id="f-cls" aria-label="Weight class"></select>
        <select id="f-lock" aria-label="Availability"></select>
      </div>
      <span class="count" id="count"></span>
      <ul class="list" id="list" role="listbox" tabindex="0" aria-label="Wrestlers (arrow keys to move, / to search)"></ul>
    </div>
    <article class="panel" id="panel"></article>
    <p class="vh" id="announce" aria-live="polite"></p>
  </section>

  <section class="view" id="titles" role="tabpanel" hidden>
    <div class="tt" id="titletext"></div>
  </section>

  <section class="view" id="about" role="tabpanel" hidden>
    <div class="wrap"><div class="prose" id="abouttext"></div></div>
  </section>
</div>

<script type="application/json" id="data">/*DATA*/</script>
<script>
(function () {
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const W = D.wrestlers, T = D.templates, MOVES = D.moves, SLOTS = D.slots;
/*THEME_JS*/
let kind = "roster", cur = null, vi = 0;

/* ---------- tabs */
const TABS = ["db", "titles", "about"];
function setTab(t) { TABS.forEach(k => { $("#t-" + k).setAttribute("aria-selected", k === t); $("#" + k).hidden = k !== t; }); }
TABS.forEach(k => { $("#t-" + k).onclick = () => setTab(k); });

/* ---------- list */
const items = () => kind === "roster" ? W : T;
function lockOf(x) {
  if (kind === "roster") return x.never ? ["never", "Never unlocked"] : x.locked ? ["shop", x.shop.length ? `Shop ${x.shop[0].price}` : "Locked"] : null;
  return x.locked ? ["shop", x.shop ? `Shop ${x.shop.price}` : "Locked"] : null;
}
function fill(sel, label, values) { sel.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option>${esc(v)}</option>`).join(""); }
function filters() {
  const it = items();
  if (kind === "roster") { fill($("#f-promo"), "Promotion", [...new Set(it.map(x => x.promotion))]); fill($("#f-cls"), "Weight class", [...new Set(it.map(x => x.cls))]); }
  else { fill($("#f-promo"), "Kind", [...new Set(it.map(x => x.category))]); fill($("#f-cls"), "Weight class", []); }
  $("#f-cls").hidden = kind !== "roster";
  $("#f-lock").innerHTML = `<option value="">Availability</option><option value="open">Available from the start</option><option value="locked">Locked</option>`;
}
function draw() {
  const q = $("#q").value.trim().toLowerCase(), fp = $("#f-promo").value, fc = $("#f-cls").value, fl = $("#f-lock").value;
  const rows = items().filter(x => (!fp || (kind === "roster" ? x.promotion : x.category) === fp) && (!fc || x.cls === fc)
    && (!fl || (fl === "locked") === !!(x.locked || x.never))
    && (!q || [x.name, x.name_jp, ...x.variants.flatMap(v => [v.nick, v.nick_jp, v.move_text, ...v.specials.map(s => MOVES[s[2]])])].join(" ").toLowerCase().includes(q)));
  $("#count").textContent = `${rows.length} shown`;
  $("#list").innerHTML = rows.map(x => { const l = lockOf(x), on = cur === x;
    const sub = kind === "roster" ? `${esc(x.promotion)} · ${esc(x.cls)}${x.variants.length > 1 ? `<span class="cc" title="${x.variants.length} costumes">×${x.variants.length}</span>` : ""}` : esc(KIND_SHORT[x.category] || x.category);
    return `<li role="option" data-id="${x.id}" class="${PC(x)}${on ? " sel" : ""}" aria-selected="${on}"><span class="nm">${esc(x.name)}</span>${l ? `<span class="lock ${l[0]}">${esc(l[1])}</span>` : "<span></span>"}<span class="sub2">${sub} <span class="jp" lang="ja">${esc(x.name_jp)}</span></span></li>`; }).join("");
}
/* promotion colours (pages_common.css --p-*), on the list's left edge and the panel's tag */
const PROMO_C = { "New Japan": "njpw", "NOAH": "noah", "All Japan": "ajpw", "ZERO-ONE": "zero1", "WJ": "wj", "Pancrase": "pancrase" };
const PC = x => kind === "roster" && PROMO_C[x.promotion] ? "pc-" + PROMO_C[x.promotion] : "";
const KIND_SHORT = { "Wrestler type": "Style template", "Pro sample": "Pro wrestler sample", "Fighter sample": "Fighter sample" };
const pick = (li, push) => { if (li) show(items().find(x => x.id == li.dataset.id), 0, push); };
$("#list").addEventListener("click", e => pick(e.target.closest("li"), true));
/* keyboard: arrows move through the list, Home/End, / focuses search, Esc clears it */
$("#list").addEventListener("keydown", e => {
  const lis = [...$("#list").children]; if (!lis.length) return;
  let i = lis.findIndex(li => li.classList.contains("sel"));
  const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: lis.length - 1, PageDown: i + 10, PageUp: i - 10 }[e.key];
  if (to === undefined) return;
  e.preventDefault();
  const li = lis[Math.max(0, Math.min(lis.length - 1, to))];
  pick(li, false); li.scrollIntoView({ block: "nearest" });
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.target.closest("input, select, textarea")) { e.preventDefault(); setTab("db"); $("#q").focus(); $("#q").select(); }
  else if (e.key === "Escape" && e.target === $("#q")) { $("#q").value = ""; draw(); $("#list").focus(); }
});
["#q"].forEach(s => $(s).addEventListener("input", draw));
["#f-promo", "#f-cls", "#f-lock"].forEach(s => $(s).addEventListener("change", draw));
function setKind(k) {
  kind = k;
  $("#kind").innerHTML = [["roster", "Roster"], ["templates", "Edit samples"]].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === kind}">${l}</button>`).join("");
  filters(); draw(); show(items()[0], 0);
}
$("#kind").onclick = e => { const b = e.target.closest("button"); if (b) setKind(b.dataset.v); };

/* ---------- profile */
const age = b => b ? `${b.year}-${String(b.month).padStart(2, "0")}-${String(b.day).padStart(2, "0")}` : "Unknown";
const SKILL = { recovery: "Recovery", recovery_bleeding: "Recovery (bleeding)", breathing: "Breathing", breathing_bleeding: "Breathing (bleeding)", spirit: "Spirit", spirit_bleeding: "Spirit (bleeding)", neck_durability: "Neck", arm_durability: "Arms", waist_durability: "Waist", leg_durability: "Legs", move_speed: "Move speed", post_climbing: "Turnbuckles", soul_buttons: "Soul buttons", critical: "Critical type", mode_special_skill: "Mode skill" };
const tone = v => /Injured|Weak|Poor|Low/.test(v) ? "bad" : /Strong|Good|High/.test(v) ? "good" : "";
function bars(obj, cls) { return `<div class="bars ${cls}">${Object.entries(obj).map(([k, n]) => { const hi = n >= 9 ? " hi" : ""; return `<span class="${hi}">${esc(k)}</span><span class="bar${hi}"><i style="width:${n * 10}%"></i></span><span class="n${hi}">${n}</span>`; }).join("")}</div>`; }
const SPECIAL = { finisher: "Finisher", signature1: "Signature", signature2: "Signature", signature3: "Signature", signature4: "Signature" };
/* Button codes (u16 after each move slot's name in table 1450), as the Edit Mode move screen
   draws them (verified in game, 2026-10-16). ✚ = a direction on the D-pad; the Soul moves carry
   the red 魂 icon. 999 = no button (entrance slots). docs/TECHNICAL.md "Wrestler data". */
const BASE = { 0: "□", 1: "×", 2: "○", 3: "△", 6: "□×", 7: "△○", 24: "R1" };
const BUTTON = Object.assign({}, BASE, {
  8: "✚+□", 9: "✚+×", 10: "✚+○", 14: "✚+□×",
  16: "R1+□", 17: "R1+×", 18: "R1+○", 19: "R1+△", 20: "R1+□×", 21: "R1+△○", 22: "R1+□×",
  25: "R2", 26: "R2+✚", 27: "Right stick ▲", 28: "Right stick ◀", 29: "Right stick ▶", 30: "Right stick ▼" });
const SOUL = c => c === 6 || c === 7 || c === 14 || c === 22;
/* Button icons (disc, DPAD, shoulder, stick, PLUS): shared, from tools/pagekit.py */
const FACE = { 0: ["sq"], 1: ["x"], 2: ["o"], 3: ["tri"], 6: ["sq", "x"], 7: ["tri", "o"] };
const STICK_OF = { 27: "up", 28: "left", 29: "right", 30: "down" };
const STICK_NAME = { up: "up", left: "left", right: "right", down: "down" };
function buttonIcons(c) {
  const face = f => f.map(disc).join("");
  if (FACE[c]) return face(FACE[c]);
  if (c >= 8 && c <= 15 && FACE[c - 8]) return DPAD + PLUS + face(FACE[c - 8]);
  if (c >= 16 && c <= 22) return shoulder("R1") + PLUS + face([["sq"], ["x"], ["o"], ["tri"], ["sq", "x"], ["tri", "o"], ["sq", "x"]][c - 16]);
  if (c === 24) return shoulder("R1");
  if (c === 25) return shoulder("R2");
  if (c === 26) return shoulder("R2") + PLUS + DPAD;
  if (STICK_OF[c]) return stick(STICK_OF[c]) + `<span class="bnote">R-stick</span>`;
  return "";
}
const buttonTitle = c => (BUTTON[c] || "").replace("✚", "D-pad ").replace("Right stick", "Right stick");
function moveset(v) {
  const spc = new Map(v.specials.map(s => [s[1], s[0]])), groups = new Map(), titles = new Map();
  let shown = 0;
  v.moves.forEach((m, k) => {
    if (m < 0 || MOVES[m] === "Do Nothing") return;
    const [name, label, btn, cat] = SLOTS[k];
    let g = label || name;
    if (cat >= 5 && cat <= 16) {   /* one set per Clutch Setting: the grapple chosen there picks it (0x163580) */
      const set = v.moves[D.clutch_slots[cat - 5]];
      if (set < 0 || MOVES[set] === "Do Nothing") return;
      const gb = SLOTS[D.clutch_slots[cat - 5]][2];
      g = `${cat <= 10 ? "Front" : "Rear"} grapple (${BUTTON[gb] || "?"}): ${MOVES[set]}`;
      titles.set(g, `${cat <= 10 ? "Front" : "Rear"} grapple ${buttonIcons(gb)}: ${esc(MOVES[set])}`);
    }
    if (!groups.has(g)) groups.set(g, new Map());
    const sit = groups.get(g);
    const key = (BASE[btn] && name === BASE[btn]) || name === g ? "" : BASE[btn] ? name.replace(" " + BASE[btn], "") : name;   // grapple slots are named after their button
    if (!sit.has(key)) sit.set(key, []);
    sit.get(key).push([k, btn, m]);
    shown++;
  });
  return `<section id="p-moves"><h3>Moveset</h3>
    <p class="small muted">The ${shown} moves ${esc(v.name)} has: the move used in each situation, as set in Edit Mode's move list. Empty ("Do Nothing") slots are left out. Each grapple chosen under Clutch Settings has its own set of follow-ups, shown under that grapple's name. The finisher and signatures are marked.</p>
    <div class="legendb"><span>${disc("sq")}${disc("x")}${disc("o")}${disc("tri")} face buttons</span><span>${DPAD} a direction held</span><span>${shoulder("R1")}${shoulder("R2")} shoulder buttons</span><span>${stick("up")} right stick</span><span><span class="soul" lang="ja">魂</span> a Soul move, as the game marks it: uses one of the wrestler's Soul buttons</span></div>
    <div class="mgroups">${[...groups].map(([g, sit]) => `<div class="mgroup"><h4>${titles.get(g) || esc(g)}</h4>${[...sit].map(([name, list]) =>
      list.map(([k, btn, m], n) => `<div class="mr${spc.has(k) ? " spc" : ""}"><span class="sit">${n === 0 ? esc(name) : ""}</span><span class="btn2" title="${esc(buttonTitle(btn))}">${buttonIcons(btn)}${SOUL(btn) ? '<span class="soul" lang="ja" title="Soul move (the game\'s red 魂 icon)">魂</span>' : ""}</span><span><span class="mvn">${esc(MOVES[m])}</span>${spc.has(k) ? `<span class="tagf">${spc.get(k) === "finisher" ? "Finisher" : "Signature"}</span>` : ""}</span></div>`).join("")).join("")}</div>`).join("")}</div></section>`;
}
function show(x, i, push) {
  if (!x) { $("#panel").innerHTML = ""; return; }
  cur = x; vi = i;
  document.querySelectorAll("#list li").forEach(li => { const on = li.dataset.id == x.id; li.classList.toggle("sel", on); li.setAttribute("aria-selected", on); });
  const v = x.variants[i] || x.variants[0], roster = kind === "roster", l = lockOf(x);
  const costumes = x.variants.length > 1 ? `<div class="seg" id="vsel" role="group" aria-label="Costume">${x.variants.map((y, k) => `<button type="button" data-k="${k}" aria-pressed="${k === i}">Type ${y.type}${y.locked ? " 🔒" : ""}</button>`).join("")}</div>` : "";
  const unlock = roster
    ? (x.never ? `<p class="bad">Nothing in the game unlocks this wrestler (the translation's <span class="k">--unlocks all</span> option does).</p>`
      : x.locked ? `<p>Locked at first. ${x.shop.length ? `Buy <b>${esc(x.shop[0].name)}</b> in the Secret Shop (${x.shop[0].price} souls).` : "Unlocked outside the shop (Kotetsu Yamamoto: finish the Dojo)."}</p>` : `<p>Available from the start.${x.shop.length ? ` Extra costumes: ${x.shop.map(s => `<b>${esc(s.name)}</b> (${s.price} souls)`).join(", ")}.` : ""}</p>`)
    : (x.locked ? `<p>Locked at first. ${x.shop ? `Buy <b>${esc(x.shop.name)}</b> in the Secret Shop (${x.shop.price} souls).` : ""}</p>` : `<p>Available from the start.</p>`);
  const lockTag = !l ? "" : l[0] === "never" ? `<span class="lock never">Never unlocked</span>` : `<span class="lock shop">${esc(l[1].replace(/^Shop (\d+)$/, "Shop: $1 souls"))}</span>`;
  $("#panel").className = "panel " + PC(x);
  $("#panel").innerHTML = `
    <div class="phead">
      <div class="kick"><span class="ptag">${esc(roster ? x.promotion : x.category)}</span>${roster ? esc(x.cls) : ""}<span lang="ja">${esc(v.name_jp)}</span>${lockTag}</div>
      <h2>${esc(v.name)}</h2>
      ${v.nick ? `<p class="nick">"${esc(v.nick)}"${v.move_text ? ` · <b>${esc(v.move_text)}</b>` : ""}</p>` : ""}
      ${!roster && x.help ? `<p class="muted">${esc(x.help)}</p>` : ""}
    </div>
    <nav class="jump" aria-label="Jump to">${[["p-moves", "Moves"], ["p-stats", "Stats"], ["p-skills", "Skills & profile"], ["p-avail", "Availability"]].map(([id, t]) => `<button type="button" data-to="${id}">${t}</button>`).join("")}</nav>
    ${costumes}
    <div class="facts">
      <div class="fact"><div class="fk">Height / weight</div><div class="v">${v.height} cm, ${v.weight} kg</div></div>
      <div class="fact"><div class="fk">Born</div><div class="v">${age(v.birthday)}</div></div>
      <div class="fact"><div class="fk">From</div><div class="v">${esc(v.nation)}</div></div>
      <div class="fact"><div class="fk">Fight style</div><div class="v">${esc(v.style)}</div></div>
      <div class="fact"><div class="fk">Popularity</div><div class="v">${esc(v.popularity)}</div></div>
    </div>
    <section id="p-special"><h3>Finisher &amp; signatures</h3><ul class="sp">${v.specials.map(([kd, slot, m]) => `<li${kd === "finisher" ? ' class="fin"' : ""}><span class="k2">${SPECIAL[kd]}</span><span class="mv">${esc(MOVES[m] || "?")}</span><span class="sl2">${SLOTS[slot] ? `${esc(SLOTS[slot][1] || SLOTS[slot][0])} <span title="${esc(buttonTitle(SLOTS[slot][2]))}">${buttonIcons(SLOTS[slot][2])}</span>` : ""}</span></li>`).join("")}</ul></section>
    ${moveset(v)}
    <section id="p-stats"><h3>Parameters</h3><div class="statgrid"><div><h4>Offense</h4>${bars(v.offense, "off")}</div><div><h4>Defense</h4>${bars(v.defense, "def")}</div></div></section>
    <section id="p-skills" class="two"><div><h3>Skills</h3><dl class="kv">${Object.entries(v.skills).map(([k, val]) => `<dt>${esc(SKILL[k] || k)}</dt><dd class="${tone(String(val))}">${esc(val)}</dd>`).join("")}</dl>${v.match_skills.length ? `<p style="margin-top:8px"><span class="muted small">Match skills:</span> ${v.match_skills.map(esc).join(", ")}</p>` : ""}</div>
      <div><h3>Profile</h3><dl class="kv"><dt>Build</dt><dd>${esc(v.build)}</dd><dt>Reversals (odds)</dt><dd>${esc(v.rev_odds)}</dd><dt>Reversals (moves)</dt><dd>${esc(v.rev_moves)}</dd><dt>Favourite colour</dt><dd>${esc(v.color)}</dd><dt>Voices</dt><dd>${v.voices.map(esc).join("<br>")}</dd><dt>Stance</dt><dd>${esc(v.stance)}</dd><dt>Body</dt><dd>${esc(v.body)}</dd><dt>Theme</dt><dd>${esc(v.theme)}</dd><dt>Entrance</dt><dd>${v.entrance.filter(Boolean).map(esc).join("<br>")}</dd></dl></div></section>
    <section id="p-avail"><h3>Availability</h3>${unlock}${roster && x.mm.length ? `<p class="small" style="margin-top:6px"><span class="muted">Match Maker rosters:</span> ${x.mm.map(esc).join(", ")}</p>` : ""}</section>`;
  const vs = $("#vsel"); if (vs) vs.onclick = e => { const b = e.target.closest("button"); if (b) show(x, +b.dataset.k, true); };
  $("#panel .jump").onclick = e => { const b = e.target.closest("button"); if (b) $("#" + b.dataset.to).scrollIntoView({ block: "start", behavior: "smooth" }); };
  $("#announce").textContent = v.name;
  /* deep link: #roster/<id>, with /<type> for a costume other than the first; clicks add history */
  const h = `#${kind}/${x.id}${i ? "/" + (v.type || i + 1) : ""}`;
  try { if (push && location.hash !== h) history.pushState(null, "", h); else history.replaceState(null, "", h); } catch (e) { /* file:// */ }
}
/* ---------- titles and teams */
(function () {
  const byName = {}; W.forEach(w => { byName[w.id] = w.name; });
  /* a champion is a name key ("Tenzan"): link it when exactly one roster wrestler's name contains it */
  const champ = h => { const hits = W.filter(w => w.name.includes(h)); return hits.length === 1 ? wlink(esc(h), "roster/" + hits[0].id) : esc(h); };
  const CAMP_C = { "New Japan": "njpw", "NOAH": "noah", "All Japan": "ajpw", "ZERO-ONE": "zero1", "WJ": "wj", "Pancrase": "pancrase" };
  let last = null;
  const rows = D.titles.map(t => { const first = t.campaign !== last; last = t.campaign;
    return `<tr class="${first ? "first " : ""}${CAMP_C[t.campaign] ? "pc-" + CAMP_C[t.campaign] : ""}"><td class="camp">${first ? esc(t.campaign) : ""}</td><td><b>${esc(t.name)}</b></td><td>${t.holders.map(h => h.map(champ).join(" &amp; ") || "-").join(" <span class='muted'>/</span> ")}</td><td>${t.shows.map((ok, k) => ok ? k + 1 : "").filter(Boolean).join(", ") || "None"}</td></tr>`; }).join("");
  const teams = D.teams.map(t => `<tr><td><b>${esc(t.name)}</b></td><td>${t.members.map(id => byName[id] ? wlink(esc(byName[id]), "roster/" + id) : "#" + id).join(", ")}</td></tr>`).join("");
  $("#titletext").innerHTML = `<div class="wrap"><div class="prose"><h2>Match Maker champions</h2><p>Each Match Maker campaign has its own belts. When a campaign starts the game picks one of three candidate champions at random. A champion is found by name, so "Tenzan" means whoever's name contains it. A belt can only be defended on the shows listed.</p></div>
    <div class="tablebox"><table><thead><tr><th>Campaign</th><th>Title</th><th>Possible champions</th><th>Shows</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="wrap"><div class="prose"><h2>Elimination teams</h2><p>The ready-made teams for 5-on-5 Elimination matches.</p></div>
    <div class="tablebox"><table><thead><tr><th>Team</th><th>Members</th></tr></thead><tbody>${teams}</tbody></table></div></div>`;
})();

/* ---------- about */
$("#abouttext").innerHTML = `
<h2>Where this comes from</h2>
<p>Everything here is read from the game's own wrestler data: ${W.length} wrestlers with ${W.reduce((s, w) => s + w.variants.length, 0)} costumes (Type 1–4), and ${T.length} Edit Mode samples. The same data is used in every mode.</p>
<ul>
<li><b>Names</b> follow the English translation; Japanese names are shown alongside.</li>
<li><b>Parameters</b> run 1–10. <b>Skills</b> are the Edit Mode labels (durability "Injured" is a real setting: Chono's neck, Fujinami's waist, Mutoh's legs).</li>
<li><b>Moveset</b>: the move the wrestler uses in each of the game's 285 move slots (every situation and button Edit Mode lets you set), leaving out empty slots; the finisher and signatures are highlighted.</li>
<li><b>Locked</b> wrestlers and costumes come from the Secret Shop (see <a class="sl" href="../secret-shop/">Secret Shop &amp; unlocks</a>). Spike Tomoki and the four Trainees are on the disc but nothing in the game unlocks them.</li>
</ul>
<p class="note">A few labels are decoded from the code without an in-game check yet: the direction of Recovery/Breathing/Spirit, Move speed and Turnbuckles, and the theme names (the game may pick the "(Clap)" version of a theme). The CPU logic settings aren't decoded.</p>
<h2>Sources</h2>
<p class="small muted">Built by <span class="k">tools/rosterdb.py</span>. Formats and addresses: docs/TECHNICAL.md, "Wrestler data".</p>`;

/* ---------- start, and links from the other pages (#roster/<id>, #templates/<id>) */
function fromHash() {
  const hm = (location.hash || "").slice(1).split("/");
  const k = hm[0] === "templates" ? "templates" : "roster";
  setTab("db");
  if (k !== kind || !cur) setKind(k);
  if (hm[1]) { const x = items().find(y => y.id == hm[1]); if (x) { const t = +hm[2] || 0, vk = t ? Math.max(0, x.variants.findIndex(y => y.type == t)) : 0; show(x, vk); const ul = $("#list"), li = ul.querySelector(`li[data-id="${x.id}"]`); if (li) ul.scrollTop = li.offsetTop - ul.offsetTop - ul.clientHeight / 3; } }
}
kind = "";
fromHash();
window.addEventListener("hashchange", fromHash);
window.addEventListener("popstate", fromHash);
})();
</script>
